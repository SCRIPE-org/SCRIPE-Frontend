<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="promoSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="promoGlow" cx="80%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#c6ff00" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridLines" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c6ff00" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c6ff00" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="600" height="240" rx="16" fill="url(#promoSky)"/>
  <rect width="600" height="240" rx="16" fill="url(#promoGlow)"/>

  <!-- Geometric Court Vector Accents in Background -->
  <polygon points="340,240 580,240 550,60 380,60" fill="url(#gridLines)" stroke="#c6ff00" stroke-opacity="0.2" stroke-width="1.5"/>
  <line x1="360" y1="150" x2="565" y2="150" stroke="#c6ff00" stroke-opacity="0.2" stroke-width="1.5"/>
  <line x1="465" y1="60" x2="465" y2="240" stroke="#c6ff00" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Subtle bokeh circles -->
  <circle cx="500" cy="80" r="45" fill="#c6ff00" fill-opacity="0.12"/>
  <circle cx="430" cy="120" r="30" fill="#38bdf8" fill-opacity="0.1"/>
  <circle cx="540" cy="170" r="25" fill="#34d399" fill-opacity="0.15"/>
</svg>
