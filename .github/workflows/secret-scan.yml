name: "Secret Leak Protection"

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Detect Leaked Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install and Run Gitleaks CLI
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf -- "$temp_dir"' EXIT
          archive="$temp_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$temp_dir" gitleaks

          args=(detect --verbose --redact)
          if [[ -f .gitleaks.toml ]]; then
            args+=(-c .gitleaks.toml)
          fi
          if [[ -f .gitleaksignore ]]; then
            args+=(-i .gitleaksignore)
          fi

          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" && -n "$PR_HEAD_SHA" ]]; then
            args+=(--log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}")
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              args+=(--log-opts="${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}")
            else
              base_ref=""
              for candidate in origin/development origin/main; do
                if git rev-parse --verify "$candidate" >/dev/null 2>&1; then
                  base_ref="$(git merge-base "$candidate" "$PUSH_AFTER_SHA" || true)"
                  if [[ -n "$base_ref" ]]; then
                    break
                  fi
                fi
              done
              if [[ -n "$base_ref" && "$base_ref" != "$PUSH_AFTER_SHA" ]]; then
                args+=(--log-opts="${base_ref}..${PUSH_AFTER_SHA}")
              else
                args+=(--log-opts="-n 1")
              fi
            fi
          fi

          "$temp_dir/gitleaks" "${args[@]}"
